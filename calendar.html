(function(){
  const grid = document.getElementById('cal-grid');
  const monthLabel = document.getElementById('cal-month');
  const postsTitle = document.getElementById('posts-title');
  const postsList = document.getElementById('posts-list');
  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth(); // 0-11
  let selectedDate = null;

  const WEEKDAYS = ['日','一','二','三','四','五','六'];

  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function dateKey(y, m, d){ return y + '-' + pad(m+1) + '-' + pad(d); }

  function hasPosts(key){ return Object.prototype.hasOwnProperty.call(POSTS_BY_DATE, key); }

  function renderCalendar(){
    monthLabel.textContent = viewYear + '年' + (viewMonth+1) + '月';
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const todayKey = dateKey(now.getFullYear(), now.getMonth(), now.getDate());
    let html = '';
    for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(viewYear, viewMonth, d);
      const cls = ['cal-cell'];
      if (hasPosts(key)) cls.push('has-posts');
      if (key === todayKey) cls.push('today');
      if (key === selectedDate) cls.push('selected');
      html += '<div class="' + cls.join(' ') + '" data-key="' + key + '" data-day="' + d + '">' + d + '</div>';
    }
    grid.innerHTML = html;
  }

  function renderPosts(key){
    if (!key || !hasPosts(key)) {
      postsTitle.textContent = key ? (key + ' 无文章') : '请选择日期';
      postsList.innerHTML = '<p class="cal-empty">这一天没有发布博客</p>';
      return;
    }
    selectedDate = key;
    postsTitle.textContent = key + ' 共 ' + POSTS_BY_DATE[key].length + ' 篇';
    postsList.innerHTML = POSTS_BY_DATE[key].map(p =>
      '<div class="post"><h3><a href="' + p.u + '">' + p.t + '</a></h3></div>'
    ).join('');
    // 高亮选中的格子
    const cells = grid.querySelectorAll('.cal-cell');
    cells.forEach(c => c.classList.toggle('selected', c.dataset.key === key));
  }

  grid.addEventListener('click', function(e){
    const cell = e.target.closest('.cal-cell');
    if (!cell || !cell.dataset.key) return;
    if (hasPosts(cell.dataset.key)) {
      renderPosts(cell.dataset.key);
    } else {
      selectedDate = null;
      postsTitle.textContent = cell.dataset.key + ' 无文章';
      postsList.innerHTML = '<p class="cal-empty">这一天没有发布博客</p>';
      const cells = grid.querySelectorAll('.cal-cell');
      cells.forEach(c => c.classList.toggle('selected', c.dataset.key === cell.dataset.key));
    }
  });

  document.getElementById('cal-prev').addEventListener('click', function(){
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', function(){
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  // 初始：默认展示今天所在月份，若今天有文章则自动显示
  renderCalendar();
  const todayKey = dateKey(now.getFullYear(), now.getMonth(), now.getDate());
  if (hasPosts(todayKey)) renderPosts(todayKey);
})();
</script>
